function usageChart(a){return `<section class="sc-section"><div class="sc-heading"><h2>최근 사용량</h2><span class="sc-small">월별 사용 크레딧 · 예시</span></div><div class="sc-card sc-inner"><div class="sc-bars" role="img" aria-label="${esc(a.name)} 5월부터 10월까지 사용 크레딧: ${a.history.join(', ')}">${a.history.map((n,i)=>`<div class="sc-bar-col"><div class="sc-bar ${i===5?'active':''}" style="--sc-height:${n/a.total*100}%"><b>${fmt(n)}</b></div><span>${i+5}월</span></div>`).join('')}</div><p class="sc-chart-summary">이번 달 ${fmt(a.total-a.remaining)} 크레딧 사용 · ${Math.round((a.total-a.remaining)/a.total*100)}% 사용</p></div></section>`;}

async function disconnectLive(){

function creditReference(balance){
  if(!balance||String(balance.plan).toLowerCase()!=='pro'||typeof balance.credits!=='number'||!Number.isFinite(balance.credits)||balance.credits<0)return null;

}

    if(!response.ok)throw Error(data.message||'잔액을 확인하지 못했어요. 잠시 후 다시 시도해주세요.');

    if(!data.connected&&live.balance)live.error='연결이 만료됐어요. 다시 연결해주세요.';

  const app=s.apps.find(x=>x.id===s.selected)||s.apps[0],record=subscriptionRecord(app);

};
billingV3=homeV4;
const navigateScreen=change;
change=function(screen){navigateScreen(screen);root.scrollIntoView({block:'start',behavior:'auto'});};
el.addEventListener('click',event=>{
  const button=event.target.closest('[data-usage]');
  if(button&&!usageExamples.some(x=>x.id===button.dataset.usage)){
    const app=s.apps.find(x=>x.id===button.dataset.usage);
    if(app)usageExamples.push({id:app.id,name:app.name,letter:app.letter,plan:app.plan,remaining:null,total:null});
  }
},true);
el.addEventListener('click',event=>{const button=event.target.closest('[data-subscription-filter]');if(button){s.subscriptionFilter=button.dataset.subscriptionFilter;render();}});

render();
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const options={radius:32,color:'blue',syncScenario:'정상'};const tweak=new Tweak({container:el,onChange:()=>{el.style.borderRadius=options.radius+'px';s.color=options.color;applyThemeV5();s.syncScenario=options.syncScenario;render();}});tweak.addSlider(options,'radius',{label:'화면 모서리',min:12,max:40,unit:'px'});tweak.addSelect(options,'color',{label:'밝은 색상 비교',options:[{label:'스카이 블루',value:'blue'},{label:'라벤더',value:'lavender'},{label:'피치',value:'peach'}]});tweak.addSelect(options,'syncScenario',{label:'새로고침 결과 시연',options:['정상','재로그인','응답 없음']});}
})();
