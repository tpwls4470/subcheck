<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>subcheck 수집 실험</title><style>body{width:320px;margin:0;padding:20px;font:14px/1.6 system-ui;background:#f6faff;color:#203b56;box-sizing:border-box}h1{font-size:21px}button,a{display:block;box-sizing:border-box;width:100%;padding:12px;margin:12px 0;border-radius:12px;border:1px solid #cddff6;background:#fff;color:#24558e;text-align:center;text-decoration:none}label{display:flex;align-items:center;gap:8px;min-height:44px}small{color:#526a83}pre{white-space:pre-wrap;font:13px/1.7 system-ui}input{width:20px;height:20px}</style></head><body><h1>subcheck 수집 실험</h1><p>Codex·Work 공유 사용량<br><small>일반 ChatGPT 대화 한도가 아닙니다.</small></p><label><input id="enabled" type="checkbox">이 브라우저에서 수집 켜기</label><p><small>ChatGPT 사용량 설정 화면에 실제 표시된 비율만 읽습니다. 대화·쿠키·로그인 토큰을 읽지 않으며 계정 동기화는 아래에서 별도로 켤 수 있습니다.</small></p><label><input id="syncEnabled" type="checkbox">내 서브체크 계정에 동기화</label><small>5시간·주간 잔여율, 수집 시각, 초기화 예상 시각만 저장합니다. PC의 서브체크 연결 탭을 열어둬야 합니다.</small><button id="connect">서브체크 연결 탭 열기</button><p id="syncStatus" role="status"></p><pre id="status">확인 중…</pre><a href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener">사용량 화면에서 수집 검증</a><button id="clear">이 브라우저의 수집 기록 삭제</button><p><small>같은 계정의 휴대폰에서 기록을 볼 수 있습니다. 사용량 설정 화면을 닫으면 새 수집은 멈춥니다.</small></p><script src="popup.js"></script></body></html>
